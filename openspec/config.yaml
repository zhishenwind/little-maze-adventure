schema: spec-driven

context: |
  项目：迷路小森林，面向 3–6 岁儿童的中文迷宫游戏。
  当前交付为本地 React Web；微信小程序迁移是未来方向，尚未实现。
  技术栈：React、TypeScript、Vite；纯算法位于 src/game/maze.ts。
  保持规则与平台渲染、输入、音频和存储分离，便于未来迁移。
  产品原则：触屏优先、无倒计时或失败惩罚、不依赖后端。
  文档与说明使用简体中文；OpenSpec 结构标题及 SHALL/MUST、WHEN/THEN 保留英文。
  使用 npm run spec -- <command> 调用项目锁定的 OpenSpec CLI。
  项目协作规则见 AGENTS.md，完整迭代步骤见 docs/DEVELOPMENT.md。

rules:
  proposal:
    - 简述问题、变更范围、受影响能力和非目标，区分当前行为与计划行为。
  specs:
    - 描述可验证的用户行为；每个 Requirement 包含 SHALL 或 MUST 以及至少一个 Scenario。
    - 与已有能力保持同名目录；只为新增或改变的行为编写 delta。
    - 涉及移动端输入时包含触屏续拖、墙体碰撞或对应回归场景。
  design:
    - 记录与本次变更相关的关键决策、替代方案和兼容性影响，避免重复代码细节。
  tasks:
    - 使用可勾选的小任务，覆盖实现、规格同步、适当验证和验证结果记录。
    - 仅在实际完成且有验证依据时勾选任务；本地提交与归档结果记录在迭代说明中。

operations:
  apply:
    guidance:
      - 先读取变更工件再实施；保留用户已有修改，避免引入无关功能。
      - 运行 npm run check；涉及交互或布局时再运行 npm run test:e2e，记录结果与验证限制。
  archive:
    guidance:
      - 核对任务和验证结果，更新 CHANGELOG.md，将已完成的 delta 同步到主规格再归档。
      - 不为未实现或仅有规划的能力声明完成；将未来方向留在后续迭代中。
